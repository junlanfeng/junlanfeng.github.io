name: Sync Upstream

on:
  schedule:
    - cron: '0 7 * * *'   # UTC 7:00 = 北京时间 15:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 领导的仓库
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0

      # ✅ 新增：配置 Git 用户身份
      - name: 配置 Git 用户信息
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 添加你的原始仓库为上游
        run: |
          git remote add upstream https://772960429:${{ secrets.ACCESS_TOKEN }}@github.com/772960429/junlanfeng.git

      - name: 拉取并合并你的最新代码
        run: |
          git fetch upstream main
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "同步自 772960429/junlanfeng"

      - name: 推送合并后的代码到领导的仓库
        run: |
          git push origin main
